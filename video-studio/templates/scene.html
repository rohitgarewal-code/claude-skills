<!doctype html>
<!--
  Seekable motion template. Everything on screen is a pure function of time t, so
  render_html.mjs can render any frame exactly, and the page plays in a browser for preview
  (space = play/pause, arrows = prev/next scene, drag the scrubber).

  Build a video by: 1) setting the brand tokens in :root, 2) writing one <section class="scene">
  per storyboard scene, 3) declaring the timeline at the bottom with Motion.scene() and Motion.tween().
  Rules: never animate with CSS transitions or setTimeout; never put a CSS transform on an element
  that Motion animates (wrap it instead); keep every scene inside the 96px safe margin.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video</title>
<style>
  /* Fonts: copy woff2 files into ./fonts (npm i @fontsource-variable/inter @fontsource/jetbrains-mono) */
  @font-face { font-family: 'Brand Sans'; font-weight: 100 900; font-display: block;
    src: url('fonts/inter-latin-wght-normal.woff2') format('woff2'), local('Inter Variable'), local('Inter'); }
  @font-face { font-family: 'Brand Mono'; font-weight: 400; font-display: block;
    src: url('fonts/jetbrains-mono-latin-400-normal.woff2') format('woff2'), local('JetBrains Mono'), local('DejaVu Sans Mono'); }

  :root {
    /* Brand tokens: replace with brand.json values when the project has one */
    --bg: #F5F2EA;       /* paper */
    --ink: #15171B;      /* primary text */
    --muted: #6A6E75;    /* secondary text */
    --line: #D9D3C5;     /* hairlines, inactive shapes */
    --accent: #D9481F;   /* the ONE highlight colour: use it on one thing per scene */
    --accent-2: #2F5D8A; /* optional second, for diagrams only */
    --sans: 'Brand Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'Brand Mono', ui-monospace, Menlo, monospace;
    --safe: 96px;
  }
  html, body { margin: 0; height: 100%; background: #0d0d0f; overflow: hidden; }
  #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden;
    background: var(--bg); color: var(--ink); font-family: var(--sans); transform-origin: 0 0;
    -webkit-font-smoothing: antialiased; font-feature-settings: 'ss01', 'cv11'; }
  html.alpha, html.alpha body, html.alpha #stage { background: transparent !important; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .safe { position: absolute; inset: var(--safe); }

  /* Type scale at 1080p. Nothing smaller than 28px on screen. */
  .kicker { font: 500 28px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .h1 { font-weight: 700; font-size: 104px; line-height: 1.02; letter-spacing: -0.035em; margin: 0; }
  .h2 { font-weight: 650; font-size: 72px; line-height: 1.06; letter-spacing: -0.03em; margin: 0; }
  .body { font-weight: 450; font-size: 40px; line-height: 1.3; color: var(--muted); margin: 0; }
  .accent { color: var(--accent); }
  .mono { font-family: var(--mono); }
  .rule { height: 2px; background: var(--ink); transform-origin: left center; }
  .card { background: #fff; border: 2px solid var(--line); border-radius: 20px; padding: 32px 36px; }
  .row { display: flex; gap: 32px; align-items: center; }
  .inline { display: inline-block; }

  /* Preview controls (hidden when rendering) */
  #ctl { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
    padding: 10px 16px; background: rgba(0,0,0,.72); color: #eee; font: 13px system-ui; z-index: 9; }
  #ctl button { background: #333; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #ctl input { flex: 1; }
  #chapters { display: flex; gap: 6px; flex-wrap: wrap; max-width: 45%; }
  #chapters span { cursor: pointer; opacity: .75; } #chapters span:hover { opacity: 1; text-decoration: underline; }
  body.render #ctl { display: none; }
</style>
</head>
<body>
<div id="stage">

  <!-- Scene 1 -->
  <section class="scene" id="s1">
    <div class="safe" style="display:flex;flex-direction:column;justify-content:center;gap:36px">
      <div class="kicker" id="s1-kicker">Template · Scene 1</div>
      <h1 class="h1"><span class="inline" id="s1-a">Say one thing</span><br><span class="inline accent" id="s1-b">per scene.</span></h1>
      <div class="rule" id="s1-rule" style="width:420px"></div>
    </div>
  </section>

  <!-- Scene 2 -->
  <section class="scene" id="s2">
    <div class="safe" style="display:flex;flex-direction:column;justify-content:center;gap:56px">
      <h2 class="h2">Numbers count up from the source.</h2>
      <div class="row">
        <div class="card"><div class="kicker">Tests</div><div class="h1 mono" id="n1">0</div></div>
        <div class="card"><div class="kicker">Tools</div><div class="h1 mono" id="n2">0</div></div>
        <div class="card"><div class="kicker">Fixes</div><div class="h1 mono accent" id="n3">0</div></div>
      </div>
    </div>
  </section>

  <!-- Scene 3 -->
  <section class="scene" id="s3">
    <svg width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0">
      <g fill="none" stroke="var(--ink)" stroke-width="3">
        <path id="p1" d="M 420 540 C 700 540, 760 380, 960 380" />
        <path id="p2" d="M 420 540 C 700 540, 760 700, 960 700" />
        <path id="p3" d="M 1100 380 C 1300 380, 1300 540, 1500 540" />
        <path id="p4" d="M 1100 700 C 1300 700, 1300 540, 1500 540" />
      </g>
      <g font-family="var(--sans)" font-size="40" font-weight="600" text-anchor="middle">
        <g id="b1"><rect x="220" y="490" width="200" height="100" rx="18" fill="#fff" stroke="var(--line)" stroke-width="2"/><text x="320" y="554">Input</text></g>
        <g id="b2"><rect x="960" y="330" width="140" height="100" rx="18" fill="#fff" stroke="var(--line)" stroke-width="2"/><text x="1030" y="394">A</text></g>
        <g id="b3"><rect x="960" y="650" width="140" height="100" rx="18" fill="#fff" stroke="var(--line)" stroke-width="2"/><text x="1030" y="714">B</text></g>
        <g id="b4"><rect x="1500" y="490" width="220" height="100" rx="18" fill="var(--accent)"/><text x="1610" y="554" fill="#fff">Output</text></g>
      </g>
    </svg>
    <div class="safe"><div class="kicker" id="s3-k">Lines draw on, boxes pop in</div></div>
  </section>

</div>

<div id="ctl">
  <button id="play">Play</button>
  <span id="time">0.00</span>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <div id="chapters"></div>
</div>

<script>
/* ---------- Motion: a tiny deterministic timeline (no dependencies) ---------- */
const Motion = (() => {
  const EASE = {
    linear: t => t,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outQuint: t => 1 - Math.pow(1 - t, 5),
    outExpo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  };
  // cubic-bezier(x1, y1, x2, y2) as an ease function, for design-system curves
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x; if (Math.abs(e) < 1e-6) break; const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      if (Math.abs(sx(t) - x) > 1e-4) { let lo = 0, hi = 1; t = x; for (let i = 0; i < 40; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; } }
      return sy(t);
    };
  }
  const DEF = { opacity: 1, x: 0, y: 0, scale: 1, rotate: 0, blur: 0, draw: 1, text: 1, count: 0, clip: 1 };
  const tracks = new Map();   // element -> Map(prop -> [segments])
  const hooks = [];           // custom fn(t) for anything else (canvas, charts)
  const scenes = [];
  let dirty = true, duration = 0;

  const els = sel => (typeof sel === 'string' ? [...document.querySelectorAll(sel)]
    : Array.isArray(sel) ? sel.flatMap(els) : sel ? [sel] : []);

  // tween(selector, { at, dur, ease, from: {...}, to: {...}, stagger, format })
  // props: opacity x y scale rotate blur | draw (SVG stroke 0..1) | text (typewriter 0..1) | count (number) | clip (wipe 0..1)
  function tween(sel, o) {
    const list = els(sel);
    if (!list.length) console.warn('Motion: nothing matches', sel);
    list.forEach((el, i) => {
      const at = o.at + (o.stagger || 0) * i;
      const m = tracks.get(el) || new Map(); tracks.set(el, m);
      const props = new Set([...Object.keys(o.from || {}), ...Object.keys(o.to || {})]);
      props.forEach(p => {
        const arr = m.get(p) || []; m.set(p, arr);
        arr.push({ at, dur: o.dur ?? 0.6, ease: typeof o.ease === 'function' ? o.ease : EASE[o.ease || 'outCubic'] || EASE.outCubic, from: o.from?.[p], to: o.to?.[p] });
      });
      if (props.has('text') && el.dataset.full === undefined) el.dataset.full = el.textContent;
      if (props.has('draw') && el.getTotalLength) { const L = el.getTotalLength(); el.style.strokeDasharray = L; el.dataset.len = L; }
      if (props.has('count')) el._fmt = o.format || (n => Math.round(n).toLocaleString('en-US'));
    });
    dirty = true;
    return api;
  }

  // scene(selector, start, end, { in: 0.5, out: 0.5 }) — fades the whole scene; in/out 0 = hard cut.
  // For a crossfade, start the next scene at (end - out) of the previous one.
  function scene(sel, start, end, o = {}) {
    const el = els(sel)[0];
    const fin = o.in ?? 0.5, fout = o.out ?? 0.5;
    scenes.push({ el, start, end, title: o.title || el.id });
    tween(el, { at: start, dur: fin || 0.0001, ease: 'linear', from: { opacity: 0 }, to: { opacity: 1 } });
    tween(el, { at: end - fout, dur: fout || 0.0001, ease: 'linear', to: { opacity: 0 } });
    duration = Math.max(duration, end);
    return api;
  }

  function finalize() {
    for (const m of tracks.values()) for (const [p, arr] of m) {
      arr.sort((a, b) => a.at - b.at);
      arr.forEach((s, i) => {
        // from-only tween: animate from the given value to the element's natural value
        // to-only tween: animate from wherever the previous tween left it
        s.f = s.from ?? (i ? arr[i - 1].t : DEF[p]);
        s.t = s.to ?? (s.from !== undefined ? DEF[p] : s.f);
      });
    }
    dirty = false;
  }

  function valueAt(arr, t) {
    if (t < arr[0].at) return arr[0].f;
    let s = arr[0];
    for (const x of arr) if (x.at <= t) s = x; else break;
    const p = Math.min(1, Math.max(0, (t - s.at) / s.dur));
    return s.f + (s.t - s.f) * s.ease(p);
  }

  function apply(el, v) {
    if ('x' in v || 'y' in v || 'scale' in v || 'rotate' in v) {
      const tr = `translate(${v.x ?? 0}px, ${v.y ?? 0}px) scale(${v.scale ?? 1}) rotate(${v.rotate ?? 0}deg)`;
      if (el instanceof SVGElement) { el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center'; }
      el.style.transform = tr;
    }
    if ('opacity' in v) el.style.opacity = v.opacity;
    if ('blur' in v) el.style.filter = v.blur > 0.01 ? `blur(${v.blur}px)` : 'none';
    if ('draw' in v) el.style.strokeDashoffset = el.dataset.len * (1 - v.draw);
    if ('text' in v) { const f = el.dataset.full; el.textContent = f.slice(0, Math.round(f.length * v.text)); }
    if ('count' in v) el.textContent = el._fmt(v.count);
    if ('clip' in v) el.style.clipPath = `inset(-20% ${(1 - v.clip) * 100}% -20% 0)`;
  }

  function seek(t) {
    if (dirty) finalize();
    for (const [el, m] of tracks) {
      const v = {};
      for (const [p, arr] of m) v[p] = valueAt(arr, t);
      apply(el, v);
    }
    for (const s of scenes) s.el.style.visibility = (t >= s.start - 0.001 && t <= s.end + 0.001) ? 'visible' : 'hidden';
    for (const h of hooks) h(t);
  }

  // words(selector, { at, stagger, dur, ease, cls }): reveal a headline word by word, at reading pace.
  // Splits text into inline-block spans once; cls is added to each word (e.g. a gradient-text class).
  function words(sel, o = {}) {
    els(sel).forEach(el => {
      if (!el._words) {
        const out = [];
        const walk = n => [...n.childNodes].forEach(c => {
          if (c.nodeType === 3) {
            const frag = document.createDocumentFragment();
            c.textContent.split(/(\s+)/).forEach(part => {
              if (!part) return;
              if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
              const w = document.createElement('span'); w.textContent = part; w.style.display = 'inline-block';
              if (o.cls) w.className = o.cls; frag.appendChild(w); out.push(w);
            });
            n.replaceChild(frag, c);
          } else if (c.nodeType === 1 && c.tagName !== 'BR') walk(c);
        });
        walk(el); el._words = out;
      }
      tween(el._words, { at: o.at, dur: o.dur ?? 0.5, stagger: o.stagger ?? 0.09, ease: o.ease || 'outCubic', from: o.from || { opacity: 0, y: 10 } });
    });
    return api;
  }

  // steps(selector, [[t, text], ...]): swap an element's text at given times (section counters, labels).
  function steps(sel, list) {
    const el = els(sel)[0];
    hooks.push(t => { let v = list[0][1]; for (const [at, txt] of list) if (t >= at) v = txt; if (el.textContent !== v) el.textContent = v; });
    return api;
  }

  // cue(t, type, opts): a sound moment for soundtrack.py. Types: 'ding' (an achievement; each one steps
  // up the scale), 'tick' (a soft count/row landing), 'whoosh' (a transition), 'hit' (a low accent).
  const cues = [];
  function cue(t, type = 'ding', opts = {}) { cues.push({ t: +t.toFixed(3), type, ...opts }); return api; }

  const api = {
    tween, scene, seek, EASE, bezier, words, steps, cue, get cues() { return cues; },
    hook: fn => { hooks.push(fn); return api; },
    get duration() { return duration; }, set duration(d) { duration = d; },
    get scenes() { return scenes; },
  };
  return api;
})();

/* ---------- Timeline (edit this) ---------- */
// Scene 1: 0–5s
Motion.scene('#s1', 0, 5, { in: 0, out: 0.5, title: 'Say one thing' })
  .tween('#s1-kicker', { at: 0.3, dur: 0.5, from: { opacity: 0, y: 16 } })
  .tween('#s1-a', { at: 0.6, dur: 0.7, ease: 'outQuint', from: { opacity: 0, y: 40 } })
  .tween('#s1-b', { at: 0.85, dur: 0.7, ease: 'outQuint', from: { opacity: 0, y: 40 } })
  .tween('#s1-rule', { at: 1.4, dur: 0.8, ease: 'inOutCubic', from: { scale: 0 }, to: { scale: 1 } });
// Scene 2: crossfades in at 4.5s
Motion.scene('#s2', 4.5, 10, { in: 0.5, out: 0.5, title: 'Count up' })
  .tween('#s2 .card', { at: 4.9, dur: 0.6, stagger: 0.12, ease: 'outBack', from: { opacity: 0, y: 30, scale: 0.96 } })
  .tween('#n1', { at: 5.2, dur: 1.6, ease: 'outExpo', from: { count: 0 }, to: { count: 21000 }, format: n => Math.round(n).toLocaleString('en-US') + '+' })
  .tween('#n2', { at: 5.35, dur: 1.6, ease: 'outExpo', from: { count: 0 }, to: { count: 377 } })
  .tween('#n3', { at: 5.5, dur: 1.6, ease: 'outExpo', from: { count: 0 }, to: { count: 1000 }, format: n => Math.round(n).toLocaleString('en-US') + '+' });
// Scene 3: 9.5–15s
Motion.scene('#s3', 9.5, 15, { in: 0.5, out: 0, title: 'Diagram' })
  .tween('#b1', { at: 9.8, dur: 0.5, ease: 'outBack', from: { opacity: 0, scale: 0.8 } })
  .tween(['#p1', '#p2'], { at: 10.2, dur: 0.8, ease: 'inOutCubic', from: { draw: 0 }, to: { draw: 1 } })
  .tween(['#b2', '#b3'], { at: 10.8, dur: 0.5, stagger: 0.1, ease: 'outBack', from: { opacity: 0, scale: 0.8 } })
  .tween(['#p3', '#p4'], { at: 11.3, dur: 0.8, ease: 'inOutCubic', from: { draw: 0 }, to: { draw: 1 } })
  .tween('#b4', { at: 12.0, dur: 0.6, ease: 'outBack', from: { opacity: 0, scale: 0.6 } })
  .tween('#s3-k', { at: 12.6, dur: 0.5, from: { opacity: 0 } });
Motion.duration = 15;

/* ---------- Player (preview only; renderer drives window.seek) ---------- */
(() => {
  const q = new URLSearchParams(location.search);
  const render = q.has('render');
  if (render) document.body.classList.add('render');
  if (q.has('alpha')) document.documentElement.classList.add('alpha');
  window.DURATION = Motion.duration;
  window.CUES = Motion.cues;
  window.seek = t => Motion.seek(t);
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = render ? 1 : Math.min(innerWidth / 1920, (innerHeight - 48) / 1080);
    stage.style.transform = `scale(${s})`;
    stage.style.left = render ? '0' : `${(innerWidth - 1920 * s) / 2}px`;
  };
  addEventListener('resize', fit); fit();
  Motion.seek(0);
  if (render) return;
  let t = 0, playing = false, last = 0;
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  const draw = () => { Motion.seek(t); scrub.value = (t / Motion.duration) * 1000; time.textContent = t.toFixed(2) + 's'; };
  const loop = now => {
    if (!playing) return;
    t += (now - last) / 1000; last = now;
    if (t >= Motion.duration) { t = Motion.duration; playing = false; playBtn.textContent = 'Play'; }
    draw(); requestAnimationFrame(loop);
  };
  const toggle = () => {
    if (t >= Motion.duration) t = 0;
    playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play';
    if (playing) { last = performance.now(); requestAnimationFrame(loop); }
  };
  const jump = d => { const st = Motion.scenes.map(s => s.start); const i = st.findIndex(s => s > t + 0.01);
    t = d > 0 ? (i < 0 ? t : st[i]) : (st.filter(s => s < t - 0.3).pop() ?? 0); draw(); };
  playBtn.onclick = toggle;
  scrub.oninput = () => { t = (scrub.value / 1000) * Motion.duration; draw(); };
  addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight') jump(1);
    if (e.key === 'ArrowLeft') jump(-1);
  });
  const ch = document.getElementById('chapters');
  Motion.scenes.forEach((s, i) => { const b = document.createElement('span'); b.textContent = `${i + 1}. ${s.title}`;
    b.onclick = () => { t = s.start + 0.001; draw(); }; ch.appendChild(b); });
  draw();
})();
</script>
</body>
</html>
