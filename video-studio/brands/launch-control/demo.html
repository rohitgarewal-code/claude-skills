<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch Control · brand demo</title>
<link rel="stylesheet" href="lc.css">
<style>
  /* Preview controls (hidden when rendering) */
  #ctl { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 12px; align-items: center;
    padding: 10px 16px; background: rgba(0,0,0,.72); color: #eee; font: 13px system-ui; z-index: 9; }
  #ctl button { background: #333; color: #fff; border: 0; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  #ctl input { flex: 1; }
  #chapters { display: flex; gap: 6px; flex-wrap: wrap; max-width: 45%; }
  #chapters span { cursor: pointer; opacity: .75; } #chapters span:hover { opacity: 1; text-decoration: underline; }
  body.render #ctl { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div class="aurora" id="au1"></div><div class="aurora" id="au2"></div><div class="aurora" id="au3"></div>
  <div class="grid"></div>
  <section class="scene" id="s1">
    <div class="head"><p class="kicker" id="k">Brand demo · Launch Control</p><h2 class="h2" id="h">Every state, every link.</h2>
      <p class="cap" id="c">Reference only: the components, not a layout to copy.</p></div>
    <svg id="m1" width="1920" height="1080" viewBox="0 0 1920 1080" style="position:absolute;inset:0" aria-hidden="true"></svg>
  </section>
  <div id="frame"><span class="l"><span class="live"></span>Video studio · Brand demo</span><span class="r" id="section">Launch Control</span></div>
  <div id="rule"><div class="bar" id="pbar"></div></div>
</div>
<div id="ctl">
  <button id="play">Play</button>
  <span id="time">0.00</span>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <div id="chapters"></div>
</div>

<script>
/* ---------- Motion: a tiny deterministic timeline (no dependencies) ---------- */
const Motion = (() => {
  const EASE = {
    linear: t => t,
    inCubic: t => t * t * t,
    outCubic: t => 1 - Math.pow(1 - t, 3),
    inOutCubic: t => (t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    outQuint: t => 1 - Math.pow(1 - t, 5),
    outExpo: t => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inOutSine: t => -(Math.cos(Math.PI * t) - 1) / 2,
    outBack: t => { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  };
  // cubic-bezier(x1, y1, x2, y2) as an ease function, for design-system curves
  function bezier(x1, y1, x2, y2) {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx, cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = t => ((ax * t + bx) * t + cx) * t, sy = t => ((ay * t + by) * t + cy) * t, dx = t => (3 * ax * t + 2 * bx) * t + cx;
    return x => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 8; i++) { const e = sx(t) - x; if (Math.abs(e) < 1e-6) break; const d = dx(t); if (Math.abs(d) < 1e-6) break; t -= e / d; }
      if (Math.abs(sx(t) - x) > 1e-4) { let lo = 0, hi = 1; t = x; for (let i = 0; i < 40; i++) { if (sx(t) < x) lo = t; else hi = t; t = (lo + hi) / 2; } }
      return sy(t);
    };
  }
  const DEF = { opacity: 1, x: 0, y: 0, scale: 1, rotate: 0, blur: 0, draw: 1, text: 1, count: 0, clip: 1 };
  const tracks = new Map();   // element -> Map(prop -> [segments])
  const hooks = [];           // custom fn(t) for anything else (canvas, charts)
  const scenes = [];
  let dirty = true, duration = 0;

  const els = sel => (typeof sel === 'string' ? [...document.querySelectorAll(sel)]
    : Array.isArray(sel) ? sel.flatMap(els) : sel ? [sel] : []);

  // tween(selector, { at, dur, ease, from: {...}, to: {...}, stagger, format })
  // props: opacity x y scale rotate blur | draw (SVG stroke 0..1) | text (typewriter 0..1) | count (number) | clip (wipe 0..1)
  function tween(sel, o) {
    const list = els(sel);
    if (!list.length) console.warn('Motion: nothing matches', sel);
    list.forEach((el, i) => {
      const at = o.at + (o.stagger || 0) * i;
      const m = tracks.get(el) || new Map(); tracks.set(el, m);
      const props = new Set([...Object.keys(o.from || {}), ...Object.keys(o.to || {})]);
      props.forEach(p => {
        const arr = m.get(p) || []; m.set(p, arr);
        arr.push({ at, dur: o.dur ?? 0.6, ease: typeof o.ease === 'function' ? o.ease : EASE[o.ease || 'outCubic'] || EASE.outCubic, from: o.from?.[p], to: o.to?.[p] });
      });
      if (props.has('text') && el.dataset.full === undefined) el.dataset.full = el.textContent;
      if (props.has('draw') && el.getTotalLength) { const L = el.getTotalLength(); el.style.strokeDasharray = L; el.dataset.len = L; }
      if (props.has('count')) el._fmt = o.format || (n => Math.round(n).toLocaleString('en-US'));
    });
    dirty = true;
    return api;
  }

  // scene(selector, start, end, { in: 0.5, out: 0.5 }) — fades the whole scene; in/out 0 = hard cut.
  // For a crossfade, start the next scene at (end - out) of the previous one.
  function scene(sel, start, end, o = {}) {
    const el = els(sel)[0];
    const fin = o.in ?? 0.5, fout = o.out ?? 0.5;
    scenes.push({ el, start, end, title: o.title || el.id });
    tween(el, { at: start, dur: fin || 0.0001, ease: 'linear', from: { opacity: 0 }, to: { opacity: 1 } });
    tween(el, { at: end - fout, dur: fout || 0.0001, ease: 'linear', to: { opacity: 0 } });
    duration = Math.max(duration, end);
    return api;
  }

  function finalize() {
    for (const m of tracks.values()) for (const [p, arr] of m) {
      arr.sort((a, b) => a.at - b.at);
      arr.forEach((s, i) => {
        // from-only tween: animate from the given value to the element's natural value
        // to-only tween: animate from wherever the previous tween left it
        s.f = s.from ?? (i ? arr[i - 1].t : DEF[p]);
        s.t = s.to ?? (s.from !== undefined ? DEF[p] : s.f);
      });
    }
    dirty = false;
  }

  function valueAt(arr, t) {
    if (t < arr[0].at) return arr[0].f;
    let s = arr[0];
    for (const x of arr) if (x.at <= t) s = x; else break;
    const p = Math.min(1, Math.max(0, (t - s.at) / s.dur));
    return s.f + (s.t - s.f) * s.ease(p);
  }

  function apply(el, v) {
    if ('x' in v || 'y' in v || 'scale' in v || 'rotate' in v) {
      const tr = `translate(${v.x ?? 0}px, ${v.y ?? 0}px) scale(${v.scale ?? 1}) rotate(${v.rotate ?? 0}deg)`;
      if (el instanceof SVGElement) { el.style.transformBox = 'fill-box'; el.style.transformOrigin = 'center'; }
      el.style.transform = tr;
    }
    if ('opacity' in v) el.style.opacity = v.opacity;
    if ('blur' in v) el.style.filter = v.blur > 0.01 ? `blur(${v.blur}px)` : 'none';
    if ('draw' in v) el.style.strokeDashoffset = el.dataset.len * (1 - v.draw);
    if ('text' in v) { const f = el.dataset.full; el.textContent = f.slice(0, Math.round(f.length * v.text)); }
    if ('count' in v) el.textContent = el._fmt(v.count);
    if ('clip' in v) el.style.clipPath = `inset(-20% ${(1 - v.clip) * 100}% -20% 0)`;
  }

  function seek(t) {
    if (dirty) finalize();
    for (const [el, m] of tracks) {
      const v = {};
      for (const [p, arr] of m) v[p] = valueAt(arr, t);
      apply(el, v);
    }
    for (const s of scenes) s.el.style.visibility = (t >= s.start - 0.001 && t <= s.end + 0.001) ? 'visible' : 'hidden';
    for (const h of hooks) h(t);
  }

  // words(selector, { at, stagger, dur, ease, cls }): reveal a headline word by word, at reading pace.
  // Splits text into inline-block spans once; cls is added to each word (e.g. a gradient-text class).
  function words(sel, o = {}) {
    els(sel).forEach(el => {
      if (!el._words) {
        const out = [];
        const walk = n => [...n.childNodes].forEach(c => {
          if (c.nodeType === 3) {
            const frag = document.createDocumentFragment();
            c.textContent.split(/(\s+)/).forEach(part => {
              if (!part) return;
              if (/^\s+$/.test(part)) { frag.appendChild(document.createTextNode(part)); return; }
              const w = document.createElement('span'); w.textContent = part; w.style.display = 'inline-block';
              if (o.cls) w.className = o.cls; frag.appendChild(w); out.push(w);
            });
            n.replaceChild(frag, c);
          } else if (c.nodeType === 1 && c.tagName !== 'BR') walk(c);
        });
        walk(el); el._words = out;
      }
      tween(el._words, { at: o.at, dur: o.dur ?? 0.5, stagger: o.stagger ?? 0.09, ease: o.ease || 'outCubic', from: o.from || { opacity: 0, y: 10 } });
    });
    return api;
  }

  // steps(selector, [[t, text], ...]): swap an element's text at given times (section counters, labels).
  function steps(sel, list) {
    const el = els(sel)[0];
    hooks.push(t => { let v = list[0][1]; for (const [at, txt] of list) if (t >= at) v = txt; if (el.textContent !== v) el.textContent = v; });
    return api;
  }

  const api = {
    tween, scene, seek, EASE, bezier, words, steps,
    hook: fn => { hooks.push(fn); return api; },
    get duration() { return duration; }, set duration(d) { duration = d; },
    get scenes() { return scenes; },
  };
  return api;
})();

</script>
<script src="lc.js"></script>
<script>

const svg = map('m1'), N = nodesOf(svg);
const a = node(N, { x: 96, y: 380, w: 370, label: 'S1', state: 'done', title: 'Collect inputs' });
const b = node(N, { x: 530, y: 380, w: 460, label: 'S2', state: 'progress', title: 'Build the draft', owners: ['AB'] });
const c = node(N, { x: 1060, y: 380, w: 340, label: 'S3', state: 'waiting', title: 'Review' });
const g = node(N, { x: 1404, y: 365, w: 420, h: 150, kind: 'gate', label: 'G1', state: 'gate', title: 'Go-live' });
const lp = lanePill(N, { x: 96, y: 640, w: 240, h: 70, label: 'TEAM' });
const n0 = node(N, { x: 440, y: 620, w: 420, label: 'S0', state: 'none', title: 'State not stated' });
const blk = node(N, { x: 1060, y: 760, w: 560, h: 130, label: 'ACCESS', state: 'blocked', title: 'Account needs fixing', owners: ['CD'] });
const l1 = link(svg, a.r, b.l, 'charged', 2.2), l2 = link(svg, b.r, c.l, 'moving'), l3 = link(svg, c.r, g.l, 'pending');
const l4 = link(svg, lp.r, n0.l, 'togate');
const q = queue(svg, { x: 1230, y0: 490, y1: 752, start: 2.6 });
Motion.scene('#s1', 0, 8, { in: 0, out: 0 });
Motion.steps('#section', [[0, 'Launch Control']]);
Motion.tween('#k', { at: 0.1, dur: 0.5, ease: 'settle', from: { opacity: 0, y: 12 } });
Motion.words('#h', { at: 0.25, stagger: 0.085, ease: 'settle', from: { opacity: 0, y: 12 } });
Motion.tween('#c', { at: 0.8, dur: 0.6, ease: 'settle', from: { opacity: 0 } });
enter([{ n: a }, { n: b, links: [l1] }, { n: c, links: [l2] }, { n: g, links: [l3] }, { n: lp }, { n: n0, links: [l4] }], 1.0, 0.12);
Motion.tween(blk.g, { at: 2.0, dur: 0.6, ease: 'settle', from: { opacity: 0, y: 22 } });
Motion.tween(q.mask, { at: 2.2, dur: 0.5, ease: 'settle', from: { draw: 0 }, to: { draw: 1 } });
Motion.tween(q.barrier, { at: 2.4, dur: 0.4, ease: 'outBack', from: { opacity: 0, scale: 0.4 } });
Motion.hook(t => {
  document.getElementById('au1').style.transform = `translate(${Math.sin(t / 9) * 70}px, ${Math.cos(t / 11) * 40}px)`;
  document.getElementById('au2').style.transform = `translate(${Math.cos(t / 10) * 80}px, ${Math.sin(t / 8) * 40}px)`;
  document.getElementById('pbar').style.width = (Math.min(1, t / 8) * 100) + '%';
});
Motion.duration = 8;

/* ---------- Player (preview only; renderer drives window.seek) ---------- */
(() => {
  const q = new URLSearchParams(location.search);
  const render = q.has('render');
  if (render) document.body.classList.add('render');
  if (q.has('alpha')) document.documentElement.classList.add('alpha');
  window.DURATION = Motion.duration;
  window.seek = t => Motion.seek(t);
  const stage = document.getElementById('stage');
  const fit = () => {
    const s = render ? 1 : Math.min(innerWidth / 1920, (innerHeight - 48) / 1080);
    stage.style.transform = `scale(${s})`;
    stage.style.left = render ? '0' : `${(innerWidth - 1920 * s) / 2}px`;
  };
  addEventListener('resize', fit); fit();
  Motion.seek(0);
  if (render) return;
  let t = 0, playing = false, last = 0;
  const playBtn = document.getElementById('play'), scrub = document.getElementById('scrub'), time = document.getElementById('time');
  const draw = () => { Motion.seek(t); scrub.value = (t / Motion.duration) * 1000; time.textContent = t.toFixed(2) + 's'; };
  const loop = now => {
    if (!playing) return;
    t += (now - last) / 1000; last = now;
    if (t >= Motion.duration) { t = Motion.duration; playing = false; playBtn.textContent = 'Play'; }
    draw(); requestAnimationFrame(loop);
  };
  const toggle = () => {
    if (t >= Motion.duration) t = 0;
    playing = !playing; playBtn.textContent = playing ? 'Pause' : 'Play';
    if (playing) { last = performance.now(); requestAnimationFrame(loop); }
  };
  const jump = d => { const st = Motion.scenes.map(s => s.start); const i = st.findIndex(s => s > t + 0.01);
    t = d > 0 ? (i < 0 ? t : st[i]) : (st.filter(s => s < t - 0.3).pop() ?? 0); draw(); };
  playBtn.onclick = toggle;
  scrub.oninput = () => { t = (scrub.value / 1000) * Motion.duration; draw(); };
  addEventListener('keydown', e => {
    if (e.key === ' ') { e.preventDefault(); toggle(); }
    if (e.key === 'ArrowRight') jump(1);
    if (e.key === 'ArrowLeft') jump(-1);
  });
  const ch = document.getElementById('chapters');
  Motion.scenes.forEach((s, i) => { const b = document.createElement('span'); b.textContent = `${i + 1}. ${s.title}`;
    b.onclick = () => { t = s.start + 0.001; draw(); }; ch.appendChild(b); });
  draw();
})();
</script>
</body>
</html>
